services:
  trace-agent:
    build: .
    ports:
      - "3847:3847"
      - "8742:8742"
    environment:
      DEMO_MODE: "true"
      API_PORT: "8742"
      WEB_PORT: "3847"
      API_INTERNAL_URL: "http://127.0.0.1:8742"
      CORS_ORIGINS: "http://localhost:3847,http://127.0.0.1:3847"
      MCP_TRANSPORT: "stdio"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8742/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
